<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#3a7bd5" />
    <meta name="description" content="Slide the cannon, smash the falling stones. Big ones split!" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="Stone Smash" />
    <meta property="og:description" content="Slide the cannon, smash the falling stones. Big ones split!" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Stone Smash</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1f2340;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        touch-action: none;
      }
      /* Shown while the game script downloads; removed by the Boot scene. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: linear-gradient(#3a7bd5, #9fd8f5);
        color: #ffffff;
        font:
          700 40px 'Trebuchet MS',
          system-ui,
          sans-serif;
        text-shadow: 0 3px 0 #1f2340;
        transition: opacity 0.3s;
      }
      #loading .stone {
        width: 64px;
        height: 64px;
        border-radius: 46% 54% 50% 50%;
        background: #8b5cf6;
        box-shadow: inset -8px -8px 0 #5b34c4;
        animation: drop 0.9s ease-in infinite;
      }
      @keyframes drop {
        0% {
          transform: translateY(-40px) rotate(0);
        }
        100% {
          transform: translateY(40px) rotate(90deg);
        }
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #1f2340;
        color: #ffffff;
        font:
          700 22px 'Trebuchet MS',
          system-ui,
          sans-serif;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        text-align: center;
        padding: 16px;
      }
      #rotate .phone {
        width: 44px;
        height: 76px;
        border: 5px solid #ffb627;
        border-radius: 10px;
        animation: turn 1.6s ease-in-out infinite;
      }
      @keyframes turn {
        0%,
        30% {
          transform: rotate(-90deg);
        }
        60%,
        100% {
          transform: rotate(0);
        }
      }
      @media (orientation: landscape) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading">
      <div class="stone"></div>
      Stone Smash
    </div>
    <noscript>Stone Smash needs JavaScript to run.</noscript>
    <div id="rotate">
      <div class="phone"></div>
      Turn your phone upright to play
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
